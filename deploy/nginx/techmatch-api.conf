# deploy/nginx/techmatch-api.conf
#
# Reverse proxy: public port 80 -> the Node/PM2 process on 127.0.0.1:5000.
# Using nginx instead of opening port 5000 directly means:
#   - the API is reachable on the standard port (no :5000 in the client's
#     VITE_API_URL, and no security-group rule for a random high port)
#   - certbot can issue and auto-renew a free TLS cert for this same
#     server block later (see DEPLOYMENT.md "Optional: HTTPS")
#
# Amazon Linux 2023's nginx package has no sites-available/sites-enabled
# split — it loads every file in conf.d/ directly. Install with:
#   sudo cp techmatch-api.conf /etc/nginx/conf.d/
#   sudo nginx -t                                  # validate syntax
#   sudo systemctl reload nginx
#
# (On Ubuntu/Debian instead, the equivalent is sites-available + a symlink
# in sites-enabled — see DEPLOYMENT.md's note if you picked that AMI.)
#
# Replace `api.yourdomain.com` below with your EC2 public DNS name (or a
# custom subdomain if you set one up) before deploying.

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    # Don't let nginx buffer/log the JWT in Authorization headers longer
    # than necessary; keep the proxy simple and let Express handle errors.
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
